<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accessibility Report — WCAG 2.2 (A, AA) × [data-color-scheme]</title>
<style>
:root {
  --bg: #f5f6f8; --surface: #fff; --text: #1a1a1a; --text-sub: #555;
  --border: #d0d4da; --th-bg: #eef1f4; --ok: #1a7f37;
  --fail: #c0392b; --fail-bg: #fdecea;
  --potential: #b8860b; --potential-bg: #fefadf;
  --a: #1a4f8f; --a-bg: #e8f0fa;
  --aa: #6b3fa0; --aa-bg: #f0e9fa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --surface: #1a1e26; --text: #e8eaf0; --text-sub: #9aa0ad;
    --border: #2e3340; --th-bg: #222630; --ok: #6bcf89;
    --fail: #ff6b6b; --fail-bg: #2d1515;
    --potential: #ffd966; --potential-bg: #2a2410;
    --a: #7fb3ec; --a-bg: #14202e;
    --aa: #c4a3ee; --aa-bg: #221a2e;
  }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 32px 64px; background: var(--bg); color: var(--text); font: 14px/1.6 system-ui, sans-serif; }
h1 { font-size: 22px; margin: 0 0 4px; }
.meta { color: var(--text-sub); font-size: 12px; margin: 0 0 32px; }
h2 { font-size: 16px; margin: 40px 0 10px; }
table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 13px; }
th, td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
th { background: var(--th-bg); white-space: nowrap; }
td.num { text-align: right; white-space: nowrap; }
caption { color: var(--text-sub); font-size: 12px; text-align: left; padding-bottom: 6px; }
code { font-family: ui-monospace, monospace; background: var(--th-bg); padding: 1px 4px; border-radius: 3px; font-size: 12px; }
pre { margin: 4px 0; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
ul { margin: 0; padding-left: 18px; }
li { margin-bottom: 8px; }
.badge { font-weight: bold; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.outcome-FAIL { color: var(--fail); background: var(--fail-bg); }
.outcome-POTENTIAL { color: var(--potential); background: var(--potential-bg); }
.level-A { color: var(--a); background: var(--a-bg); }
.level-AA { color: var(--aa); background: var(--aa-bg); }
.sc { white-space: nowrap; font-weight: bold; }
.where { color: var(--text-sub); font-size: 11px; }
section { margin-bottom: 56px; }
.ok { color: var(--ok); font-weight: bold; margin-top: 24px; }
</style>
</head>
<body>
<h1>Accessibility report — WCAG 2.2 (A, AA) × [data-color-scheme]</h1>
<p class="meta"></p>

<h2>By success criterion</h2>
<table id="summary">
<caption></caption>
<thead><tr>
  <th>SC</th><th>Level</th><th>Name</th><th>Rule</th>
  <th>Outcome</th><th>Schemes</th><th class="num">Nodes</th>
</tr></thead>
<tbody></tbody>
</table>

<div id="detail"></div>

<template id="detail-tpl">
<section>
  <h2></h2>
  <table>
    <thead><tr><th>Rule</th><th>Outcome</th><th>Message</th><th class="num">Nodes</th><th>Elements</th></tr></thead>
    <tbody></tbody>
  </table>
</section>
</template>

<script type="module">
const el = (tag, text) => {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    return node;
};
const badge = (cls, text) => {
    const node = el('span', text);
    node.className = `badge ${cls}`;
    return node;
};
const cell = (...children) => {
    const td = el('td');
    td.append(...children);
    return td;
};
const row = (cells) => {
    const tr = document.createElement('tr');
    cells.forEach(c => tr.append(c instanceof Node ? c : el('td', c)));
    return tr;
};

const report = await fetch('./audit.json').then(r => {
    if (!r.ok) throw new Error(`audit.json: ${r.status}`);
    return r.json();
});

document.querySelector('.meta').textContent =
    `Generated: ${report.generated} — ${report.guideline} — ` +
    `${report.schemes.length} schemes — FAIL is a breach, ` +
    `POTENTIAL needs manual confirmation`;

// A finding repeats across schemes whenever the cause is markup rather than
// palette, so rows are keyed by criterion+rule+reason and the schemes that hit
// them are collapsed into one cell. A row listing every scheme is a structural
// problem; a row listing one is palette-specific.
const groups = new Map();
for (const result of report.results) {
    for (const f of result.findings) {
        // A rule can map to several criteria; it is listed under each.
        const criteria = f.criteria.length ? f.criteria : [{ num: '—', level: '', name: 'Unmapped' }];
        for (const c of criteria) {
            const key = `${c.num}|${f.ruleId}|${f.reasonId}|${f.outcome}`;
            let g = groups.get(key);
            if (!g) {
                g = { sc: c, ruleId: f.ruleId, reasonId: f.reasonId, outcome: f.outcome,
                      message: f.message, schemes: new Set(), nodes: [] };
                groups.set(key, g);
            }
            g.schemes.add(result.scheme);
            g.nodes.push({ ...f, scheme: result.scheme });
        }
    }
}

const scKey = (num) => num.split('.').map(n => String(n).padStart(3, '0')).join('.');
const all = [...groups.values()].sort((a, b) =>
    scKey(a.sc.num).localeCompare(scKey(b.sc.num)) ||
    (a.outcome === b.outcome ? 0 : a.outcome === 'FAIL' ? -1 : 1) ||
    b.nodes.length - a.nodes.length);

// An element that fails in every scheme is one problem, not six, so each group
// counts distinct elements rather than raw findings.
for (const g of all) {
    g.elements = [...new Map(g.nodes.map(n => [n.path, n])).values()];
}

const scanned = report.results.length;
const failing = all.filter(g => g.outcome === 'FAIL').length;

document.querySelector('#summary caption').textContent =
    `${all.length} findings across ${scanned} scans — ` +
    `${failing} failing, ${all.length - failing} needing review`;

const summary = document.querySelector('#summary tbody');
const allSchemes = report.schemes.length;

for (const g of all) {
    const schemes = g.schemes.size === allSchemes
        ? 'all'
        : [...g.schemes].join(', ');
    summary.append(row([
        Object.assign(el('td', g.sc.num), { className: 'sc' }),
        g.sc.level ? cell(badge(`level-${g.sc.level}`, g.sc.level)) : el('td', ''),
        g.sc.name,
        cell(el('code', g.ruleId)),
        cell(badge(`outcome-${g.outcome}`, g.outcome)),
        schemes,
        Object.assign(el('td', String(g.elements.length)), { className: 'num' }),
    ]));
}

const detail = document.querySelector('#detail');
const tpl = document.querySelector('#detail-tpl');

if (!all.length) {
    document.querySelector('#summary').hidden = true;
    const ok = el('p', '✓ No failures or unresolved checks in any scheme.');
    ok.className = 'ok';
    detail.append(ok);
} else {
    // Detail is grouped by criterion so a reader fixing "1.4.3" sees every
    // element involved in one place.
    const byCriterion = new Map();
    for (const g of all) {
        const key = `${g.sc.num} ${g.sc.name}`;
        if (!byCriterion.has(key)) byCriterion.set(key, { sc: g.sc, groups: [] });
        byCriterion.get(key).groups.push(g);
    }

    for (const [title, { sc, groups: gs }] of byCriterion) {
        const frag = tpl.content.cloneNode(true);
        frag.querySelector('h2').textContent =
            sc.level ? `${title} (${sc.level})` : title;
        frag.querySelector('tbody').append(...gs.map(g => {
            const list = el('ul');
            list.append(...g.elements.map(n => {
                const li = el('li');
                li.append(el('code', n.snippet || ''), el('pre', n.path));
                if (n.bounds) {
                    li.append(Object.assign(
                        el('p', `at ${n.bounds.left},${n.bounds.top} ` +
                                `(${n.bounds.width}×${n.bounds.height})`),
                        { className: 'where' }));
                }
                return li;
            }));

            return row([
                cell(el('code', g.ruleId), el('pre', g.reasonId)),
                cell(badge(`outcome-${g.outcome}`, g.outcome)),
                g.message,
                Object.assign(el('td', String(g.elements.length)), { className: 'num' }),
                cell(list),
            ]);
        }));
        detail.append(frag);
    }
}
</script>
</body>
</html>

name: "CI"

on:
    push:
        branches: ["main"]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: "ci-${{ github.ref }}"
    cancel-in-progress: true

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: "git checkout"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: "install runner deps"
              working-directory: reference
              run: npm ci

            - name: "validate ./css against the css syntax definitions"
              working-directory: reference
              run: npm run validate

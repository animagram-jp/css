name: accessibility-audit

on:
    push:
        tags: ["*.*.*"]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    audit:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
        - name: "git checkout"
          uses: actions/checkout@v7

        - name: "install runner deps"
          working-directory: reference
          run: npm ci

        - name: "validate ./css against the css syntax definitions"
          working-directory: reference
          run: npm run validate

        - name: "cache playwright browsers"
          uses: actions/cache@v6
          with:
            path: ~/.cache/ms-playwright
            key: playwright-chromium-${{ runner.os }}-${{ hashFiles('reference/package-lock.json') }}

        - name: "install playwright browser"
          working-directory: reference
          run: npm run setup

        - name: "run the accessibility engine over ./index.html"
          working-directory: reference
          run: npm run audit

        - name: "upload report artifact"
          uses: actions/upload-artifact@v7
          with:
            name: accessibility-report
            path: |
              reference/audit.html
              reference/audit.json

    deploy:
        needs: audit
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: "pages"
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
        - name: "git checkout"
          uses: actions/checkout@v7

        - name: "setup Github Pages"
          uses: actions/configure-pages@v6

        - name: "download accessibility-report artifact"
          uses: actions/download-artifact@v8
          with:
            name: accessibility-report
            path: reference/

        - name: "upload artifact as Github Pages"
          uses: actions/upload-pages-artifact@v5
          with:
            path: "."

        - name: "deploy to GitHub Pages"
          id: "deployment"
          uses: actions/deploy-pages@v5

name: accessibility-audit

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
    audit:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
        - name: "git checkout"
          uses: actions/checkout@v7

        - name: "install runner deps"
          working-directory: reference
          run: npm ci

        - name: "cache playwright browsers"
          uses: actions/cache@v6
          id: playwright-cache
          with:
            path: ~/.cache/ms-playwright
            key: playwright-chromium-${{ runner.os }}-${{ hashFiles('reference/package-lock.json') }}

        # playwright-core ships no install CLI, so the browser comes from the
        # standalone `playwright` package. Its version must match the resolved
        # playwright-core exactly — a mismatch downloads a chromium build that
        # playwright-core then refuses to launch.
        - name: "resolve playwright version"
          working-directory: reference
          run: echo "PW=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_ENV"

        - name: "install playwright browser"
          if: steps.playwright-cache.outputs.cache-hit != 'true'
          run: npx --yes "playwright@$PW" install --with-deps chromium

        - name: "install playwright os deps only (cache hit)"
          if: steps.playwright-cache.outputs.cache-hit == 'true'
          run: npx --yes "playwright@$PW" install-deps chromium

        - name: "run the accessibility engine over ./index.html"
          working-directory: reference
          run: npm run audit

        - name: "upload report artifact"
          uses: actions/upload-artifact@v7
          with:
            name: accessibility-report
            path: |
              reference/audit.html
              reference/audit.json

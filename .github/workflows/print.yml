name: "print"

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    safari:
        timeout-minutes: 30
        runs-on: macos-15
        steps:
            - name: "git checkout"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: "setup uv"
              uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

            - name: "enable safaridriver"
              run: sudo safaridriver --enable

            - name: "grant apple events to safari"
              run: |
                  sudo python3 - "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "/Library/Application Support/com.apple.TCC/TCC.db" <<'EOF'
                  import sqlite3
                  import sys
                  clients = ["/opt/hca/hosted-compute-agent", "/usr/bin/osascript", "/bin/bash"]
                  targets = ["com.apple.Safari", "com.apple.systemevents"]
                  for path in sys.argv[1:]:
                      db = sqlite3.connect(path)
                      db.row_factory = sqlite3.Row
                      template = db.execute("select * from access where service = 'kTCCServiceAppleEvents' limit 1").fetchone()
                      if template is None:
                          print(path, "no template")
                          continue
                      columns = template.keys()
                      for client in clients:
                          for target in targets:
                              row = dict(template)
                              row.update(client=client, client_type=1, auth_value=2, indirect_object_identifier_type=0, indirect_object_identifier=target, indirect_object_code_identity=None)
                              db.execute(f"insert or replace into access ({', '.join(columns)}) values ({', '.join('?' for _ in columns)})", [row[c] for c in columns])
                      db.commit()
                      print(path, "granted")
                  EOF
                  sudo killall tccd || true

            - name: "compare screen, pdf and viewer"
              run: |
                  uv run --with numpy --with pillow --with pypdfium2 --with scipy python - <<'EOF'
                  import json
                  import sys
                  from pathlib import Path

                  sys.path.insert(0, "reference")
                  import compare

                  out = Path("target/print")
                  reports = compare.compare(Path("."), ["index.html"], out, "safari")
                  compare.write_index(out, reports)
                  (out / "compare_result.json").write_text(json.dumps(reports, ensure_ascii=False, indent=2))
                  EOF

            - name: "upload report"
              if: ${{ always() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: "print"
                  path: "target/print/"
                  if-no-files-found: warn
